# Topic map: ClauseType -> candidate statute sections (architecture §8.1, ADR-0004, FR-20).
# Retrieval adds at most 4 of a clause type's sections as origin TOPIC_MAP context. This file holds
# only pointers into the ingested corpus; it states no legal rule (R-10). Keys were chosen from
# the section headings of corpus release 2026.11.11-1 and resolve to the current version of each
# section at query time, so a later version label does not break a row.
#
# Review status: DRAFT. authored_by is the drafter; a team member and the legal reviewer must read
# each row against the section text and set reviewed_by before anything here is called verified.
# Clause types without a clear section in the ingested acts are left out on purpose (empty is
# honest; a guessed section would be invented law). expected_for stays empty until the corpus
# carries worker-category terms (law_term WORKER_CATEGORY), which P6 omission detection needs.
