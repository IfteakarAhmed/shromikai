  status: draft

- id: bd-maternity-leave-min
  clause_type: MATERNITY_BENEFIT
  fact: MATERNITY_LEAVE
  comparator: MIN
  value: 120
  unit: DAYS
  applies_to_category: null
  legal_basis:
    act: BLA-2006
    section: "47"
    quote: "প্রাপ্য প্রসূতি কল্যাণ সুবিধাসহ ১২০ (একশত বিশ) দিন পর্যন্ত কাজে অনুপস্থিত থাকিবার জন্য অনুমতি প্রদান করিবেন"
  severity: CRITICAL
  explanation_bn: "যোগ্য নারী শ্রমিককে প্রসূতি কল্যাণ সুবিধাসহ ১২০ দিন পর্যন্ত কাজে অনুপস্থিত থাকার অনুমতি দিতে হবে (ধারা ৪৭(৩)); সুবিধা পাওয়ার শর্ত ধারা ৪৬-এ আছে।"
  explanation_en: "An eligible woman worker must be allowed up to 120 days of absence with maternity benefit (section 47(3)); the eligibility conditions are in section 46."
  authored_by: "Claude (draft, phase P6)"
  reviewed_by: null
  review_note: null
  status: draft
