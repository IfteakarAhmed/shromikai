    reviewed_by: null
  - code: C095
    title_label: "protection of wages"
    normlex_url: "https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:12100:0::NO::P12100_ILO_CODE:C095"
