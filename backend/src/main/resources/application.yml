# ShromikAI configuration (architecture §12). Values come from environment variables only for
# secrets and deployment addresses; everything else lives here. Profiles: default, dev, test,
# demo, prod, mcp, fake-models (architecture §16.3).

server:
  port: 8080
  tomcat:
    max-swallow-size: 16MB                # read an oversized upload to its end so the client gets the 413 (FR-24)
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: shromikai
  autoconfigure:
    exclude:
      # Auth is ours (auth module); never let Boot print a generated default password to the log.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shromikai}
    username: ${DB_USER:shromikai}
    password: ${DB_PASSWORD:shromikai}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 11MB           # keep uploads in memory, never in temp files (R-02, C12)
  mvc:
    problemdetails:
      enabled: false                      # GlobalProblemHandler owns every error document
  web:
    resources:
      add-mappings: false                 # unknown routes become not-found problems
  jackson:
    default-property-inclusion: always    # optional fields are present with null (api.md §1)
  ai:
    mcp:
      server:
        enabled: false                    # only profile mcp turns the MCP server on (ADR-0021)
    retry:                                # Spring AI Ollama calls: at most 2 retries from 500 ms (AGENTS.md §6)
      max-attempts: 3
      on-client-errors: false
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    model:
      chat: ollama                        # Spring AI chat is Ollama only; Claude uses the Anthropic SDK (C2)
      embedding: ollama
    ollama:
      base-url: ${shromikai.ollama.base-url}
      init:
        pull-model-strategy: never        # scripts/dev-up.sh pulls models; startup never downloads
      chat:
        options:
          model: ${shromikai.models.local-pii}
          temperature: 0.0
      embedding:
        options:
          model: ${shromikai.models.embedding}

logging:
  structured:
    format:
      console: bd.shromikai.shared.logging.AllowlistJsonFormatter
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: never
      group:
        dependencies:                     # local models; not part of the public liveness check
          include: db

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui
  paths-to-match: /api/**

shromikai:
  models:
    reasoning: claude-sonnet-5-5
    fast: claude-haiku-5-5
    verifier: ${GEMINI_MODEL:}            # empty: verifier-fallback is used
    verifier-fallback: claude-haiku-5-5
    judge: ${GEMINI_MODEL:}
    local-pii: qwen2.5:7b-instruct
    embedding: bge-m3
  pricing:                                # US$ per million tokens (architecture §6); prices are
                                          # configuration, never code. Team model reference 2026-11-03.
    claude-sonnet-5-5:
      input: 2.00
      output: 10.00
      cache-write-5m: 2.50
      cache-write-1h: 4.00
      cache-read: 0.10
    claude-haiku-5-5:
      input: 0.10
      output: 0.50
      cache-write-5m: 0.125
      cache-write-1h: 0.20
      cache-read: 0.01
      long-context:
        above-input-tokens: 100000
        input: 0.50
        output: 2.50
        cache-write-5m: 0.625
        cache-write-1h: 1.00
        cache-read: 0.05
    gemini:                               # prices the configured GEMINI_MODEL; set the real list
      input: ${GEMINI_PRICE_IN:1.00}      # price in .env. The defaults are deliberately high so the
      output: ${GEMINI_PRICE_OUT:5.00}    # budget guard over-counts rather than under-counts.
  rules:                                  # legal rules of the active pack (architecture §9.1)
    files:
      - ${user.dir}/../data/rules/bd-labour.yaml
  verify:                                 # architecture §7.7; a change needs an ADR and an eval report
    quote-min-chars: 20
    quote-max-chars: 300
    quote-similarity-threshold: 0.92
    support-min-confidence: 0.70
    corrective-attempts: 1
    parallelism: 8
  budget:
    per-analysis-usd: 1.00                # budget-exceeded above this (architecture §5.3)
    per-analysis-tokens: 400000           # total input + output tokens of one analysis
    daily-usd: 50                         # all analyses of one Dhaka day; budget-exceeded above it (FR-62)
  memo:
    envelope-key: ${ENVELOPE_KEY:}       # blank: derived from JWT_SECRET (SignedResultCodec)
    key-id: k1
    gotenberg-url: ${GOTENBERG_URL:http://localhost:3000}
    render-timeout: 30s
    envelope-ttl: 24h                    # how long a signed result can be rendered as a memo (FR-55)
  privacy:
    store-contracts: false                # startup fails if true (R-02)
    redact-money: false                   # ADR-0003
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  ollama:
    base-url: ${OLLAMA_URL:http://localhost:11434}
    health-timeout: 2s
  auth:
    jwt-secret: ${JWT_SECRET:}            # at least 32 bytes (StartupGuards); never committed
    issuer: shromikai
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    guest-token-ttl: 2h
    lockout: { max-failures: 5, duration: 15m }
    rate-limit: { per-ip-per-minute: 20, per-user-per-minute: 10 }
    bcrypt-strength: 12
    cookie-secure: true
    hsts: false                           # on in prod
    demo-password: ${DEMO_PASSWORD:}      # read only by the demo profile
  quotas:
    guest-per-device-per-day: 3
    guest-per-ip-per-day: 10
    guest-concurrency: 1
    timezone: Asia/Dhaka
  providers:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: https://api.anthropic.com
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com
  fake-models:
    fixtures: classpath:fixtures/llm
    default-case: default
  api:
    law-search-per-minute: 60             # api.md §8.1 rate limits, per subject
  retrieval:                              # architecture §8, §12
    vector-top-k: 20
    text-top-k: 20
    fused-top-k: 8
    rrf-k: 60
    graph-max: 4
    topic-map-max: 4
    ef-search: 100                        # pgvector hnsw.ef_search (architecture §8.1)
    embed-batch-size: 16
    cache: { max-entries: 10000, ttl: 1h }
    topic-map-file: ${user.dir}/../data/mappings/bd-topics.yaml
    cli: false                            # ./gradlew embedLaws sets this
    text-max-doc-freq: 0.10               # full-text query: drop words in more than this share of sections (ADR-0013)
    text-language-filter: false           # full-text query: match only sections in the query's language (ADR-0013)
  intake:                                 # contract intake (FR-24, FR-27, NFR-20); ADR-0014
    max-bytes: 10485760                   # 10 MB in total
    max-pages: 15
    max-pixels: 36000000                  # decoded pixels per image or rendered page
    max-image-side: 6000
    pdf-timeout: 10s
    ocr-timeout: 60s
    min-ocr-confidence: 60
    ocr-parallel: 4
    raster-dpi: 200
    max-concurrent: 4                     # uploads read at the same time, service-wide; more get capacity-exhausted
    tesseract-command: [tesseract, stdin, stdout, -l, ben+eng, tsv]   # stdin/stdout only, no temp files
  analysis:
    hard-timeout: 150s                    # analysis-timeout (architecture §5.3, ADR-0016; was 120s)
    jurisdictions: [BD]                   # jurisdictions of the active pack that citations may come from
    step-timeouts:                        # per-step cancel limits, above the p95 budgets of §5.3
      retrieve: 45s
      rules: 45s
      risk: 110s                          # ADR-0016 (was 80s): 3,000-token risk answers
      verify: 40s
      correct: 50s
      compose: 70s
    max-jobs: 200                         # in-memory analysis jobs at once; more is refused (capacity-exhausted)
    job-sweep-interval: 60s               # expired jobs (30 min) are purged this often
  scraper:                                # statute ingestion (FR-12, architecture §12)
    user-agent: "ShromikAI-ingest/1.0 (+${SCRAPER_CONTACT:})"
    contact: ${SCRAPER_CONTACT:}          # required for a real run; never committed
    min-interval: 1s                      # at most 1 request per second (startup refuses less)
    timeout: 180s                         # whole response; the portal builds big pages slowly (~20 s measured)
    raw-dir: ${user.dir}/../data/raw      # git-ignored cache with SHA-256 sidecars
    cache-policy: REFRESH                 # PREFER_CACHE only while developing the parser
  mcp:                                    # MCP server limits (ADR-0021)
    rate-limit-per-minute: 60             # per API key (FR-65)
    analyze-timeout: 120s                 # analyze_employment_contract waits this long (FR-66)
    analyze-per-key-per-day: 10           # analyses one API key may start a day, per instance (NFR-06)
  ingest:
    pack-file: ${user.dir}/../data/packs/bd.yaml
    mapping-file: ${user.dir}/../data/mappings/bd-ilo.yaml
    report-dir: ${user.dir}/../eval/reports
    cli: false                            # ./gradlew ingestLaws sets this

---
spring:
  config:
    activate:
      on-profile: dev
shromikai:
  auth:
    cookie-secure: false                  # Safari rejects Secure cookies on http://localhost
logging:
  level:
    bd.shromikai: DEBUG
management:
  endpoint:
    health:
      show-details: always

---
# CI and integration tests: fakes only, no network egress (test-strategy.md §5).
spring:
  config:
    activate:
      on-profile: test
  ai:
    model:
      chat: none
      embedding: none
  http:
    client:
      factory: jdk                        # TestRestTemplate must not retry 429 or wait on Retry-After
  datasource:
    hikari:                               # cached test contexts share one Postgres (max_connections)
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 10000
springdoc:
  paths-to-exclude: /api/v1/test-probe/**   # test-only controller stays out of the snapshot
shromikai:
  ollama:
    health-timeout: 500ms
  auth:
    jwt-secret: test-only-secret-never-use-outside-tests-0123456789   # fictional; tests only
    bcrypt-strength: 4                    # speed; the default of 12 is asserted by AuthPropertiesTest
    cookie-secure: false
    rate-limit: { per-ip-per-minute: 100000, per-user-per-minute: 100000 }   # RateLimitIT lowers them
  quotas:
    guest-per-ip-per-day: 100000          # GuestQuotaServiceTest covers the per-IP limit

---
# Recorded fixtures only; results are labelled "recorded" (architecture §16.3).
spring:
  config:
    activate:
      on-profile: fake-models
  ai:
    model:
      chat: none
      embedding: none

---
# Judging deployment: real models, seeded demo accounts (P2). Needs DEMO_PASSWORD (12+ characters).
spring:
  config:
    activate:
      on-profile: demo

---
# Real deployment. Refuses to start together with demo (StartupGuards).
spring:
  config:
    activate:
      on-profile: prod
shromikai:
  auth:
    hsts: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
springdoc:
  swagger-ui:
    enabled: true

---
# MCP server over Streamable HTTP at /mcp (P8, ADR-0001).
spring:
  config:
    activate:
      on-profile: mcp

---
# Ollama exists only outside fake-models (OllamaHealthIndicator); keep it visible in the group.
spring:
  config:
    activate:
      on-profile: "!fake-models"
management:
  endpoint:
    health:
      group:
        dependencies:
          include: db,ollama
