server:
  port: 8080

spring:
  application:
    name: shromikai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shromikai}
    username: ${DB_USER:shromikai}
    password: ${DB_PASSWORD:shromikai}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:missing}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
          temperature: 0.0
          max-tokens: 4096
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init:
        pull-model-strategy: when_missing
      embedding:
        options:
          model: bge-m3
    # Only Claude is used for chat; Ollama (local, bge-m3) is used for embeddings only.
    model:
      chat: anthropic
      embedding: ollama

management:
  endpoints:
    web:
      exposure:
        include: health,info

shromikai:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  privacy:
    # Contracts are processed in memory and never written to the database or logs.
    store-contracts: false

logging:
  level:
    root: INFO
