plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'bd.shromikai'
version = '0.1.0'
description = 'Verified employment contract intelligence for Bangladesh'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    // Latest Spring AI 1.1.x GA patch for Spring Boot 3.5 (ADR-0001 version log, conflict C17).
    set('springAiVersion', '1.1.8')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

springBoot {
    // build-info.properties feeds Meta.version (FR-01).
    buildInfo {
        properties {
            // Keep the build reproducible: no build time in the artifact.
            time = null
        }
    }
}

dependencies {
    // Web API, validation, health, metrics
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Database: PostgreSQL + pgvector through JdbcClient, schema through Flyway (no JPA)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // AI: Claude through the official Anthropic Java SDK; Ollama chat and embeddings through Spring AI
    // (ADR-0001, ADR-0005). Gemini uses Spring's RestClient, no extra dependency.
    implementation 'com.anthropic:anthropic-java:3.7.0'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    // MCP server, Streamable HTTP (P8, ADR-0021); version from the Spring AI BOM
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    // Identity (P2, ADR-0010): Spring Security filter chain, HS256 JWTs through Nimbus (managed by
    // pinned here), Bucket4j rate limits.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.4'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.14.0'

    // JSON Schema 2020-12 validation of model output and API documents (R-04)
    implementation 'com.networknt:json-schema-validator:2.0.0'

    // OpenAPI document for generated frontend types (AGENTS.md §6)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // In-memory retrieval cache (P4, ADR-0012); version managed by Spring Boot
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Word-level redline diff (P7, FR-52, ADR-0020)
    implementation 'io.github.java-diff-utils:java-diff-utils:4.15'

    // Nullness annotations
    implementation 'org.jspecify:jspecify:1.0.1'

    // Statute ingestion (P3, ADR-0011): HTML parsing and polite client; PDF fallback
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'net.jqwik:jqwik:1.9.3'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------------------------
// Formatting
// ---------------------------------------------------------------------------------------------
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.28.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// ---------------------------------------------------------------------------------------------
// Test tasks by JUnit tag (docs/spec/test-strategy.md §5). TestTaggingRulesTest keeps the tags honest.
// ---------------------------------------------------------------------------------------------
def configureTestTask = { Test task ->
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.jvmArgs '-XX:+EnableDynamicAgentLoading', '-Dfile.encoding=UTF-8'
    // The integration tests cache one Spring context per profile set; with the mcp profile there
    // are enough of them to exhaust the 512 MB default (OutOfMemoryError in P8).
    task.maxHeapSize = '2g'
    task.testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('test', Test) { Test t ->
    configureTestTask(t)
    useJUnitPlatform { includeTags 'unit' }
    systemProperty 'shromikai.test.blockExternalHosts', 'true'
    // Golden files change only through ./gradlew test -PupdateGolden=true (test-strategy.md §7).
    systemProperty 'updateGolden', project.hasProperty('updateGolden').toString()
    inputs.property 'updateGolden', project.hasProperty('updateGolden')
}

def taggedTask = { String name, String tag, boolean blockExternal ->
    tasks.register(name, Test) { Test t ->
        description = "Runs tests tagged '${tag}'."
        group = 'verification'
        configureTestTask(t)
        useJUnitPlatform { includeTags tag }
        systemProperty 'shromikai.test.blockExternalHosts', blockExternal.toString()
        shouldRunAfter tasks.named('test')
    }
}

taggedTask('integrationTest', 'it', true)
tasks.named('integrationTest', Test) {
    systemProperty 'updateGolden', project.hasProperty('updateGolden').toString()
    systemProperty 'shromikai.updateOpenApi', project.hasProperty('updateOpenApi').toString()
}
taggedTask('slowTest', 'slow', true)
taggedTask('liveTest', 'live', false)
tasks.named('liveTest', Test) {
    // A live test runs only with an explicit opt-in: -PliveOk=smoke or -PliveOk=record. Nothing here
    // spends money by accident, and the US$3 cap of LiveSpendLedger holds on top (ADR-0015).
    systemProperty 'shromikai.live', project.findProperty('liveOk') ?: ''
    systemProperty 'shromikai.live.contract', project.findProperty('contract') ?: 'syn-en-02'
    outputs.upToDateWhen { false }
}

// ---------------------------------------------------------------------------------------------
// Coverage gates (test-strategy.md §15). A package gate applies once the package contains code.
// ---------------------------------------------------------------------------------------------
def coverageExcludes = [
        'bd/shromikai/ShromikAiApplication*',
        'bd/shromikai/**/*Properties.class',
        'bd/shromikai/**/*Properties$*.class',
]

jacoco {
    toolVersion = '0.8.13'
}

def jacocoClassDirs = files(sourceSets.main.output.classesDirs.collect {
    fileTree(dir: it, excludes: coverageExcludes)
})

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.from(fileTree(layout.buildDirectory.dir('jacoco')).include('test.exec', 'integrationTest.exec'))
    classDirectories.setFrom(jacocoClassDirs)
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.from(fileTree(layout.buildDirectory.dir('jacoco')).include('test.exec', 'integrationTest.exec'))
    classDirectories.setFrom(jacocoClassDirs)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
        rule {
            element = 'PACKAGE'
            includes = [
                    'bd.shromikai.verify', 'bd.shromikai.verify.*',
                    'bd.shromikai.rules', 'bd.shromikai.rules.*',
                    'bd.shromikai.privacy', 'bd.shromikai.privacy.*',
                    'bd.shromikai.retrieval', 'bd.shromikai.retrieval.*',
                    'bd.shromikai.shared.text', 'bd.shromikai.shared.text.*',
            ]
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Repository tooling that runs from the test classpath: prompt lint (AGENTS.md §5), fixture
// scanner (R-02, test-strategy.md §13) and the requirement report (test-strategy.md §18).
// ---------------------------------------------------------------------------------------------
def repoRoot = rootProject.projectDir.parentFile

def toolTask = { String name, String mainClassName, String taskDescription, List<String> toolArgs ->
    tasks.register(name, JavaExec) {
        description = taskDescription
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = mainClassName
        args toolArgs
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
}

toolTask('promptLint', 'bd.shromikai.tooling.PromptLint',
        'Checks runtime prompts, output schemas, mirror docs and the LOCK file (AGENTS.md §5).', [
        file('src/main/resources').absolutePath,
        new File(repoRoot, 'docs').absolutePath,
])

toolTask('checkFixtures', 'bd.shromikai.tooling.FixtureScanner',
        'Checks test fixtures for provenance, schema validity and PII outside canaries.yml (R-02).', [
        file('src/test/resources').absolutePath,
        file('src/main/resources').absolutePath,
])

// scripts/demo-fake-citation.sh: the verifier catches a planted fake section (FR-46). Offline: scripted
// stand-ins for the models, the statute text from the local corpus. Nothing is spent.
tasks.register('demoFakeCitation', JavaExec) {
    description = 'Shows the verifier catching a planted fake section, step by step (no cloud call).'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'bd.shromikai.tooling.DemoFakeCitation'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    standardOutput = System.out
}

// ./gradlew checkRules: every rule's quote against the corpus in the local database (FR-36).
tasks.register('checkRules', JavaExec) {
    description = 'Checks data/rules/*.yaml against the current statute text in the local database.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'bd.shromikai.tooling.RulesCorpusCheck'
    args new File(repoRoot, 'data/rules/bd-labour.yaml').absolutePath
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    standardOutput = System.out
}

toolTask('requirementsReport', 'bd.shromikai.tooling.RequirementsReport',
        'Writes build/reports/requirements.md (requirement -> tests).', [
        file('src/test/java').absolutePath,
        new File(repoRoot, 'frontend/src').absolutePath,
        layout.buildDirectory.file('reports/requirements.md').get().asFile.absolutePath,
])


// ---------------------------------------------------------------------------------------------
// Statute ingestion (FR-15, ADR-0011): ./gradlew ingestLaws [-Pacts=BLA-2006,CA-1872]
// Reads ../.env (SCRAPER_CONTACT, DB_*, JWT_SECRET, ...), fetches politely, writes
// ../eval/reports/corpus-quality.{md,json} and creates a corpus release.
// ---------------------------------------------------------------------------------------------
tasks.register('ingestLaws', JavaExec) {
    description = 'Ingests the statute corpus of the Bangladesh pack and writes the quality report.'
    group = 'application'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'bd.shromikai.ShromikAiApplication'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def envFile = new File(repoRoot, '.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def m = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)=(.*)$/
            if (m && !line.trim().startsWith('#') && m[0][2]) {
                environment m[0][1], m[0][2]
            }
        }
    }
    def cliArgs = ['--shromikai.ingest.cli=true', '--server.port=0', '--spring.main.banner-mode=off']
    if (project.hasProperty('acts')) {
        cliArgs << "--shromikai.ingest.acts=${project.property('acts')}".toString()
    }
    if (project.hasProperty('seed')) {
        cliArgs << "--shromikai.ingest.sample-seed=${project.property('seed')}".toString()
    }
    args cliArgs
    doFirst {
        if (!(environment['SCRAPER_CONTACT'] ?: System.getenv('SCRAPER_CONTACT'))) {
            throw new GradleException('SCRAPER_CONTACT is empty: set it in .env (contact address for the scraper User-Agent, FR-12).')
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Retrieval evaluation (FR-23): ./gradlew evalRetrieval
// Runs the ablation over eval/retrieval/questions.jsonl against the development database (real
// corpus, real bge-m3 on local Ollama) and writes eval/reports/retrieval.{md,json}. Loads ../.env;
// the rewrite row needs ANTHROPIC_API_KEY and is reported as not run without it. Run
// ./gradlew embedLaws first.
// ---------------------------------------------------------------------------------------------
tasks.register('evalRetrieval', Test) { Test t ->
    description = "Runs tests tagged 'eval' (retrieval ablation, writes eval/reports/retrieval.md)."
    group = 'verification'
    configureTestTask(t)
    useJUnitPlatform { includeTags 'eval' }
    systemProperty 'shromikai.test.blockExternalHosts', 'false'
    outputs.upToDateWhen { false }
    def envFile = new File(repoRoot, '.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def m = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)=(.*)$/
            if (m && !line.trim().startsWith('#') && m[0][2]) {
                t.environment m[0][1], m[0][2]
            }
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Embedding backfill (FR-18): ./gradlew embedLaws
// Embeds every section version without an up-to-date bge-m3 embedding (needs Ollama). Safe to
// re-run: sections with an unchanged content hash are skipped.
// ---------------------------------------------------------------------------------------------
def loadDotEnv = { JavaExec task ->
    def envFile = new File(repoRoot, '.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def m = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)=(.*)$/
            if (m && !line.trim().startsWith('#') && m[0][2]) {
                task.environment m[0][1], m[0][2]
            }
        }
    }
}

tasks.register('embedLaws', JavaExec) {
    description = 'Embeds statute sections that have no up-to-date embedding (bge-m3 on Ollama).'
    group = 'application'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'bd.shromikai.ShromikAiApplication'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    loadDotEnv(delegate)
    args '--shromikai.retrieval.cli=true', '--server.port=0', '--spring.main.banner-mode=off'
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest'),
            tasks.named('jacocoTestCoverageVerification'),
            tasks.named('promptLint'),
            tasks.named('checkFixtures')
}

// No heap dump on out-of-memory: a dump would hold contract text (R-02, architecture §10.1).
tasks.named('bootRun') {
    jvmArgs '-XX:-HeapDumpOnOutOfMemoryError', '-Dfile.encoding=UTF-8'
}

tasks.named('bootJar') {
    archiveFileName = 'shromikai-backend.jar'
}

tasks.named('jar') {
    enabled = false
}
