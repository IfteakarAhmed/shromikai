# CI (docs/spec/test-strategy.md §14). No step calls a paid cloud API; tests block external hosts.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (./gradlew check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Unit, integration (Testcontainers on the runner's Docker), ArchUnit, tag rules, log
      # allowlist, promptLint, fixture scanner, Spotless and JaCoCo gates.
      - run: ./gradlew check requirementsReport --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 14

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the OpenAPI snapshot
        run: npm run gen:api && git diff --exit-code src/api/types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Initial JavaScript within 200 KB gzip (NFR-10)
        run: npm run check:bundle
      - name: Install Chromium for the lite-landing check
        run: npx playwright install --with-deps chromium
      - name: Lite landing within 1.5 MB, no scene code, one throttled load (NFR-10, ADR-0023)
        run: npm run check:lite

  fixtures:
    name: fixtures (scanner and prompt lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./scripts/check-fixtures
      - run: ./gradlew promptLint --no-daemon
        working-directory: backend

  eval-smoke:
    # FR-83, evaluation.md §13: the hard safety gate on recorded results only, no model call.
    # evalSmoke recomputes M-01, M-04 (misses), M-16 and M-17 from the results of the last
    # committed evaluation run and fails when a gate is broken or report.json states other numbers.
    # EvalRunnerSmokeIT runs the runner end to end on scripted stand-ins (fictional act).
    name: eval-smoke (hard safety gate on recorded results)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew evalSmoke --no-daemon
      - run: ./gradlew integrationTest --tests 'bd.shromikai.eval.EvalRunnerSmokeIT' --no-daemon
