# CI (docs/spec/test-strategy.md §14). No step calls a paid cloud API; tests block external hosts.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (./gradlew check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Unit, integration (Testcontainers on the runner's Docker), ArchUnit, tag rules, log
      # allowlist, promptLint, fixture scanner, Spotless and JaCoCo gates.
      - run: ./gradlew check requirementsReport --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 14

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the OpenAPI snapshot
        run: npm run gen:api && git diff --exit-code src/api/types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Initial JavaScript within 200 KB gzip (NFR-10)
        run: npm run check:bundle

  fixtures:
    name: fixtures (scanner and prompt lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./scripts/check-fixtures
      - run: ./gradlew promptLint --no-daemon
        working-directory: backend
