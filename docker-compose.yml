# Local development services (architecture §16.1). Run the backend (IntelliJ or ./gradlew bootRun)
# and the frontend (npm run dev) on your machine; `docker compose --profile full up` also runs the
# backend in Docker. Image tags are pinned (ADR-0001: no floating tags).

name: shromikai

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: shromikai
      POSTGRES_USER: ${DB_USER:-shromikai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shromikai}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d shromikai"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_KEEP_ALIVE: "30m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # The image has no curl; `ollama list` talks to the local server.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  backend:
    profiles: ["full"]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/shromikai
      DB_USER: ${DB_USER:-shromikai}
      DB_PASSWORD: ${DB_PASSWORD:-shromikai}
      OLLAMA_URL: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
  ollama-data:
